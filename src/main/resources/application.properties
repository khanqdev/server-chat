spring.application.name=chat-server
spring.config.import=optional:file:.env[.properties]

spring.mongodb.uri=${MONGODB_URI}
# Needed for unique indexes (username/email) and TTL indexes (OTP, refresh token)
spring.data.mongodb.auto-index-creation=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.google.client-id=${GOOGLE_CLIENT_ID:}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
# Cổng 465 dùng SSL ngay từ đầu (MAIL_SSL_ENABLE=true); cổng 587 dùng STARTTLS
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Bỏ giới hạn cho request từ localhost (tiện test). PHẢI đặt false khi chạy production.
app.rate-limit.skip-localhost=${RATE_LIMIT_SKIP_LOCALHOST:true}
app.rate-limit.general-per-minute=${RATE_LIMIT_GENERAL_PER_MINUTE:60}
app.rate-limit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MINUTE:5}
app.rate-limit.register-per-hour=${RATE_LIMIT_REGISTER_PER_HOUR:3}
app.rate-limit.otp-verify-per-hour=${RATE_LIMIT_OTP_VERIFY_PER_HOUR:10}
app.rate-limit.max-tracked-clients=${RATE_LIMIT_MAX_TRACKED_CLIENTS:100000}
